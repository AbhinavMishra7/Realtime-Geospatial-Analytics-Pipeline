networks:
  kappa-network:
    driver: bridge

services:
  # --- SOURCE: REDPANDA ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    networks:
      - kappa-network

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: /bin/sh -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
    ports:
      - "8080:8080"
    networks:
      - kappa-network
    depends_on:
      - redpanda

  # --- CLUSTER: FLINK BRAIN & MUSCLE ---
  flink-jobmanager:
    build: .
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    volumes:
      - .:/abhinavmishra/Documents/P1/
      # Maps the JAR to the system library for auto-discovery
      - ./jars/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    networks:
      - kappa-network

  flink-taskmanager:
    build: .
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    volumes:
      - .:/abhinavmishra/Documents/P1/
      - ./jars/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 10
    networks:
      - kappa-network

  # --- SUBMITTER: THE PROCESSOR ---
  flink-processor:
    build: .
    container_name: flink-processor
    volumes:
      - .:/abhinavmishra/Documents/P1/
    # Added /bin/bash -c and sleep to ensure JobManager is ready before submission
    command: >
      /bin/bash -c "
      echo 'Waiting 20 seconds for Flink cluster to stabilize...' &&
      sleep 20 &&
      flink run -py /abhinavmishra/Documents/P1/processor.py
      "
    networks:
      - kappa-network
    depends_on:
      - flink-jobmanager
      - redpanda

  # --- STATE & SERVING: MINIO & REDIS ---
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    networks:
      - kappa-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - kappa-network
